<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Street — Tienda Deportiva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

  <header class="navbar">
    <h1 class="logo">Flow Street</h1>
    <input type="text" placeholder="Buscar productos..." id="searchInput">
    <a href="./test/sales-report.html" class="btn-report">📊 Reporte</a>
    <button id="cartButton">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Carrito
      <span id="cartCount" class="cart-badge" style="display:none">0</span>
    </button>
  </header>

  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="hero-tag">Nueva Colección 2026</span>
      <h2 class="hero-title">Viste como<br><em>un campeón</em></h2>
      <p class="hero-sub">Equipamiento mundialista. Estilo que domina la cancha.</p>
      <a href="#productsContainer" class="hero-cta">Ver colección</a>
    </div>
  </section>

  <section class="filters">
    <select id="categoryFilter">
      <option value="">Todas las categorías</option>
    </select>
  </section>

  <main class="products-container" id="productsContainer"></main>

  <!-- MODAL CARRITO -->
  <div class="cart-modal hidden" id="cartModal">
    <div class="cart-content">
      <h2>🛒 Carrito de Compras</h2>
      <div id="cartItems"></div>
      <h3 id="cartTotal">Total: $0</h3>
      <button id="buyButton">Comprar</button>

      <div class="checkout-form hidden" id="checkoutForm">
        <input type="text" id="customerId" placeholder="Número de identificación">
        <input type="text" id="customerName" placeholder="Nombre completo">
        <input type="text" id="customerAddress" placeholder="Dirección">
        <input type="text" id="customerPhone" placeholder="Teléfono">
        <input type="email" id="customerEmail" placeholder="Correo electrónico">
        <button id="confirmPurchaseBtn">Confirmar compra</button>
      </div>

      <button id="closeCart">Cerrar</button>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="./js/seed.js"></script>
  <script src="./components/product-card.js"></script>
  <script src="./components/cart-item-row.js"></script>
  <script src="./js/toast.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/app.js"></script>


</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Flow Street</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/admin.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

  <!-- LOGIN -->
  <section class="login-container" id="loginContainer">
    <form id="loginForm">
      <div class="login-logo">Flow Street</div>
      <h2>Panel de Administración</h2>
      <input type="email" id="email" placeholder="Correo electrónico" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button type="submit">Ingresar</button>
    </form>
  </section>

  <!-- DASHBOARD -->
  <section class="dashboard hidden" id="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">Flow Street</div>
      <nav>
        <ul>
          <li class="sidebar-item active" data-module="categories">
            <span>🗂️</span> Categorías
          </li>
          <li class="sidebar-item" data-module="products">
            <span>👕</span> Productos
          </li>
          <li class="sidebar-item" data-module="orders">
            <span>📦</span> Pedidos
          </li>
        </ul>
      </nav>
      <button id="logoutBtn">Cerrar sesión</button>
    </aside>

    <!-- CONTENIDO -->
    <main class="content">

      <!-- MÓDULO CATEGORÍAS -->
      <section id="module-categories" class="module">
        <div class="module-header">
          <h2>Categorías</h2>
          <button id="addCategoryBtn">+ Agregar categoría</button>
        </div>
        <div class="form-container hidden" id="categoryFormContainer">
          <input type="text" id="categoryName" placeholder="Nombre de la categoría">
          <textarea id="categoryDescription" placeholder="Descripción"></textarea>
          <div class="form-actions">
            <button id="saveCategoryBtn">Guardar</button>
            <button type="button" class="btn-cancel" id="cancelCategoryBtn">Cancelar</button>
          </div>
        </div>
        <div id="categoriesList"></div>
      </section>

      <!-- MÓDULO PRODUCTOS -->
      <section id="module-products" class="module hidden">
        <div class="module-header">
          <h2>Productos</h2>
          <button id="addProductBtn">+ Agregar producto</button>
        </div>
        <div class="form-container hidden" id="productFormContainer">
          <input type="text" id="productCode" placeholder="Código">
          <input type="text" id="productName" placeholder="Nombre del producto">
          <select id="productCategory">
            <option value="">Seleccione categoría</option>
          </select>
          <input type="number" id="productPrice" placeholder="Precio" min="0">
          <input type="text" id="productImage" placeholder="URL de imagen">
          <textarea id="productDescription" placeholder="Descripción"></textarea>
          <div class="form-actions">
            <button id="saveProductBtn">Guardar</button>
            <button type="button" class="btn-cancel" id="cancelProductBtn">Cancelar</button>
          </div>
        </div>
        <div id="productsList"></div>
      </section>

      <!-- MÓDULO PEDIDOS -->
      <section id="module-orders" class="module hidden">
        <div class="module-header">
          <h2>Pedidos</h2>
        </div>
        <div id="ordersList"></div>
      </section>

      <!-- MODAL DETALLE PEDIDO -->
      <div class="order-detail-overlay hidden" id="orderDetailOverlay">
        <div class="order-detail-modal">
          <div class="order-detail-header">
            <h3 id="orderDetailTitle">Detalle del Pedido</h3>
            <button class="order-detail-close" id="closeOrderDetail">&times;</button>
          </div>
          <div id="orderDetailBody"></div>
        </div>
      </div>

    </main>
  </section>

  <div id="toastContainer"></div>

  <script src="./js/toast.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/categories.js"></script>
  <script src="./js/products.js"></script>
  <script src="./js/orders.js"></script>
  <script src="./components/order-card.js"></script>
  <script src="./js/seed.js"></script>

</body>
</html>
